<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account & Profile Settings — CodeArena</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../assets/logo/codearena-favicon.png">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/auth.css">
    <!-- Immediate Theme Application Script -->
    <script src="../js/theme.js"></script>
    <style>
        .settings-card {
            max-width: 620px;
            margin: 40px auto;
            padding: 32px;
            background: var(--bg-card, #1e293b);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-primary, #f8fafc);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #cbd5e1;
        }
        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="auth-page">

    <header class="auth-header">
        <a href="../index.html" class="brand" title="Return to CodeArena Home">
            <img src="../assets/logo/codearena-logo.png" alt="CodeArena logo" class="brand-logo">
            <span class="head-logo">CodeArena</span>
        </a>

        <div class="auth-header-actions">
            <button class="theme-toggle" type="button" aria-label="Toggle theme">🌓</button>
            <a href="dashboard.html" class="auth-return-link">← Return to Dashboard</a>
        </div>
    </header>

    <main>
        <div class="settings-card">
            <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 4px;">Student Profile & Settings</h1>
            <p style="color: #94a3b8; font-size: 0.88rem; margin-bottom: 24px;">Configure your public student profile, preferred language, and portfolio links.</p>

            <div id="settingsFeedback" class="auth-feedback" style="display:none; margin-bottom: 16px;"></div>

            <form id="profileForm">
                <div class="form-group">
                    <label class="form-label" for="bioInput">Bio / Headline</label>
                    <textarea id="bioInput" rows="3" class="form-textarea" placeholder="Tell other learners about yourself and what you're practicing..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label" for="prefLangInput">Preferred Programming Language</label>
                    <select id="prefLangInput" class="form-select">
                        <option value="Java">Java</option>
                        <option value="Python">Python</option>
                        <option value="C++">C++</option>
                        <option value="JavaScript">JavaScript</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="githubInput">GitHub Profile URL</label>
                    <input type="url" id="githubInput" class="form-input" placeholder="https://github.com/username">
                </div>

                <div class="form-group">
                    <label class="form-label" for="linkedinInput">LinkedIn Profile URL</label>
                    <input type="url" id="linkedinInput" class="form-input" placeholder="https://linkedin.com/in/username">
                </div>

                <button type="submit" id="saveProfileBtn" class="btn btn-primary btn-auth" style="margin-top: 10px;">Save Profile Changes</button>
            </form>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const bioInput = document.getElementById('bioInput');
            const prefLangInput = document.getElementById('prefLangInput');
            const githubInput = document.getElementById('githubInput');
            const linkedinInput = document.getElementById('linkedinInput');
            const form = document.getElementById('profileForm');
            const feedback = document.getElementById('settingsFeedback');
            const saveBtn = document.getElementById('saveProfileBtn');

            function showMsg(msg, isSuccess) {
                feedback.textContent = msg;
                feedback.className = 'auth-feedback ' + (isSuccess ? 'feedback-success' : 'feedback-error');
                feedback.style.display = 'block';
            }

            // Load initial profile data
            try {
                const res = await window.CodeArenaAPI.studentService.getProfile();
                if (res.success && res.data) {
                    const p = res.data;
                    if (p.bio) bioInput.value = p.bio;
                    if (p.preferredLanguage) prefLangInput.value = p.preferredLanguage;
                    if (p.githubUrl) githubInput.value = p.githubUrl;
                    if (p.linkedinUrl) linkedinInput.value = p.linkedinUrl;
                }
            } catch (err) {
                console.warn('Could not load profile initially:', err);
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                saveBtn.disabled = true;
                saveBtn.textContent = 'Saving...';

                try {
                    const updateData = {
                        bio: bioInput.value,
                        preferredLanguage: prefLangInput.value,
                        githubUrl: githubInput.value,
                        linkedinUrl: linkedinInput.value
                    };

                    const res = await window.CodeArenaAPI.studentService.updateProfile(updateData);
                    if (res.success) {
                        showMsg('Profile settings saved successfully!', true);
                    } else {
                        showMsg(res.message || 'Failed to update profile.', false);
                    }
                } catch (err) {
                    showMsg('Network communication error.', false);
                } finally {
                    saveBtn.disabled = false;
                    saveBtn.textContent = 'Save Profile Changes';
                }
            });
        });
    </script>
</body>
</html>
